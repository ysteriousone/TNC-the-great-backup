TNC_bitter_loser:0 "Bitter Loser"
TNC_bitter_loser_desc:0 "Having lost the Second World War against the forces of Germany, France has moved to revanchist lengths, though it is Socialist. This has lead to a weird mix of Nationalist and Socialist elements, akin to Socialism in One State where the Revolution is now exclusively Paris focused."
TNC_rampant_corruption:0 "Rampant Corruption"
TNC_rampant_corruption_desc:0 "Having just risen to power, Picasso's Government still carries the burdens and sins of the previous Governments. Rather than letting their lives away for the good of the Revolution, several ministers are looting the treasuries and using bribes to get to riches. If this is not dealt with sooner than later, France will never recover."
TNC_french_mafia:0 "French Mafia"
TNC_french_mafia_desc:0 "Similar to Italy, several bandit gangs have begun to plague the French countryside. Since our Army is a bit defunct because of... Germanic victories, they have almost free reign on France. The first objective must be to allocate Internationale resources to dealing with anti-socialist scum!"
TNC_the_jewish_haven:0 "The Jewish Haven"
TNC_the_jewish_haven_desc:0 "This Country is home to many displaced Jews from the War and rising anti-semetic cultures around the World."
TNC_bastion_of_western_socialism:0 "Bastion Of Western Socialism"
TNC_bastion_of_western_socialism_desc:0 "With the fall of the USSR, France has remained the last bastion of Socialism in the Earth. With itself and the remaining left leaning powers, the Western European Proleteriat remains united."
TNC_the_artists_state:0 "The Artist State"
TNC_the_artists_state_desc:0 "Artistry is valued... Uniquely in French politics. As one might say, its job is to comfort the disturbed and disturbed the comfortable. As a result, Art is used in all sorts of French propaganda, entertainment and secret agencies. A preferrence is put on Cubist art, but sometimes it is enforced."


RUS_Terror_bombings: "Terror bombings"
RUS_Terror_bombings_desc: "with the dissapearence of Andrei Zhdanov from the Union of Soviet Socialist Republics, the Luftwaffe has now begun indiscriminant terror bombings in Russia led by Hermann Goring with dubious consent from Berlin. Though these bombings are routinely facing problems with what remains of the Red Air Force, dozens of towns, villages as well as factories are being destroyed, leaving little room for reconstruction and retaliation."
RUS_The_Eastern_SMUTA: "The Eastern Smuta"
RUS_The_Eastern_SMUTA_desc: "Novgorod was never stable, even before Maurice died. Initially viewd as a prized possesion of the Reich, the spoils have rotten to the point of being abhorrent. Partisans are almost everywhere, the collaborators have started showing their true faces and most of all, the funding from Berlin has almost stopped. If anything, Novgorod is the most free Reich territory solely because there is almost no one to stop the Bandits and Communists running amock.\n\nNow that Novgorod has collapsed and the Russians are now free to fight each other again, it would seem that Rosenberg's dream will die as he will.. Fogotten and embelished.."
RUS_Partisans_Song: "Partisan's Song"
RUS_Partisans_Song_desc: "§R Through The Valleys and over Hills, the Divisions marched forward, to capture Primoye in battle, The Stronghold of the White Army!§! \n\nThe Leftist Partisans though divided and fighting each other, all have one combined goal, to liberate Russia and Moscow from Nazi and Fascsistic forces and liberate the workers! From Saint Petersburg to Moscow to the far reaches of Novgorod, all of Russia will be liberated, no matter what cost!"
LEN_Leninist_Remnants: "Leninist Remnants"
LEN_Leninist_Remnants_desc: "Even though Lenin has died years ago, his descendents still uphold his policies and continue to fight on for the betterment of people and mankind. A man may die, but not his ideas."
HRE_Search_for_Alexei: "The Search for Alexei"
HRE_Search_for_Alexei_desc: "I know he's here somewhere. I know it. Alexei is alive. All my efforts are not for nothing. The Empire WILL be restored. I know he's here. I know he's here.I know he's here. I know he's here. I know he's here. I know he's here. I know he's here. I know he's here. I know he's here. I know he's here. I know he's here. I know he's here. I know he's here. I know he's here. I know he's here. I know he's here. I know he's here. I know he's here. I know he's here. I know he's here. I know he's here. I know he's here. I know he's here. I know he's here. I know he's here. I know he's here. I know he's here. I know he's here. I know he's here. I know he's here. I know he's here. I know he's here. I know he's here. I know he's here. I know he's here. I know he's here. I know he's here. I know he's here. I know he's here. I know he's here. I know he's here. I know he's here. I know he's here. I know he's here. I know he's here. I know he's here. I know he's here. I know he's here."
SAV_PSR_Saviors: "The Saviors of the PSR"
SAV_PSR_Saviors_desc: "Ironically, Savinkov IS the last surviving core member of the Party of Socialist Revolutionaries. Even though he is quite a controversial figure, reality doesn't care. In the end, he is the sole survivor of the P-SR and there is simply, no one else to stop him. Though ridden with guilt, he knows what he must do. For the betterment of Russia."
LIP_Fight_For_The_World: "The Fight for the World"
LIP_Fight_For_The_World_desc: "§RArise, ye Motherland! Arise for the Sacred Fight!§! \n\n Although Karbyshev and his prison inmates have just broken free, he has laid out his future plans for Novgorod and Russia. The Lipestsk charter as it is known, details about normal socialist policies but with a Nationalistic twist. In contrast to public belief, Kardyshev has no intentions to hunt down or erase every single German on Earth. his ambitions are more similar with Anti-Fascist and crusading tendencies. The 'Great Test' as it is called focuses on a future conflict with Germany that will determine the ultimate victory of either Good or Evil. Of course, that will come at the cost of the World, but Karbyshev does not care."
 