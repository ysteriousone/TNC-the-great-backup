l_english:
 BM_HISTORY_TITLE: "History"
 GATHERING_STORM_NAME: "Gathering Storm"
 GATHERING_STORM_DESC: "Dark times are coming. In Europe, Hitler has consolidated his power and his attention is now increasingly drawn beyond Germany's borders. Mussolini's Italy continues to embark on daring military adventures, while the Empire of Japan stands poised to attack China in Asia. Almost twenty years have passed since the end of the Great War, and the world has yet again been doused in gasoline. A single spark may be all it takes."
 HITTING_FAN_NAME: "The Hitting of the Fan"
 HITTING_FAN_DESC: "Yup, that's right! That umbrella collection is about to come in real handy."
 CAN_desc: "The Union Jack, untainted by Mosley’s own imitation of the Swastika, proudly files over the cities of Ontario, of Montreal, and of Vancouver. But in the halls of Parliament Hill, the slums of Quebec, or the fisheries of the West, those who are grouped together as ‘Canadians’ can’t help but quietly grumble about the differences between the West and the East, the French and the English. And then the British exiles came.\n\nCanada is happy to keep the last reigns of Britain’s long democratic tradition, one that Canadians inherit and cherish as their own, alive on its snowy lands. Its bolstered Navy of loyal ships ensure its deterrence, and it remains a rare bastion of stability in this current world. But it was woefully unprepared for the unthinkable, leaving more and more distraught Canadians to propose dropping the mask and telling the Pommies their time is up…"
 GER_desc: "Germany had finally done it. The rest of the World cannot prevent the rightful redemption against Versailles, the rightful conquest of our Lebensraum, and the inevitable rise of the National Socialist eagle over Continental Europe. For once, Victory has smiled at the long-suffering German people, under the grace of their loving, glorious, genius Fuhrer! Rejoice!\n\nExcept Victoria has no intention of letting Germania rest. The Greater German Reich enters its first decade without war wearied by its massive army, its bickering Party, its patchwork bureaucracy, its war-locked economy, and the endless resistance against its brutality. As progress slowly reverses its pace, the Reich mindlessly continues purging the rot, without end.\n\nAnd thus, the Heart of the Party continues to§R beat, beat, beat…§! Who knows what will give first, the rot or the country?"
 KOM_DESC: "When Marshal Voroshilov found himself adrift in a broken Motherland, he rousingly called for those who still believe in the ideas of the Soviet Union to his service, garnered his former comrades also lost in the Taiga, and headquartered himself in Syktyvkar with a sincere oath: to bring back the Union of Soviet Socialist Republic, to return victoriously to Moskva, to beat back the dark hordes of Fascism!\n\nBut the situation on the ground couldn't be more cruel. The Arctic Circle is unfriendly to inhabitation, and Voroshilov finds himself ever more tired and frail. True Soviet Communism’s last chance must grow from the books, speeches and temporary provisions, or it shall perish exiled in the frozen North."
 COUNTRY_SELECTION_CHARACTER_DESC_NAME: "$NAME|Y$" 
 COUNTRY_SELECTION_CHARACTER_DESC: "$NAME|Y$ $DESC|$\n$TRAITS_DESC|$"