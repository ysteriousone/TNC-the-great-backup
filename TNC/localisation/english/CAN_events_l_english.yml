 l_english:
   CAN.1.t:0 "The Canadian Government under controversy!"
   CAN.1.d:0 "The Canadian Government under the Liberal Party has made a decision to force the resignation of the Governor of Canada, who is not in fact a Liberal member but instead a Conservative. This move has been valued by the youth but has been seen as a betrayal by the ancestors of this great nation. Since then, Mackenzie King has become both the Prime Minister and the Governor of Canada."
   CAN.1.a:0 "Push His Resignation!"
   CAN.1.b:0 "Support the Governor!"