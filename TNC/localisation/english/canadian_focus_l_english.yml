l_english:
 CAN_reform_the_ccf:0 "Reform The CCF"
 CAN_reform_the_ccf_desc:0 "Come, staple comrades! And bask in the glory of our electoral victory! (excuse the terminology, the person who wrote this is British.)"
 CAN_reunite_as_one:0 "Reunite As One"
 CAN_reunite_as_one_desc:0 "We must reunite as one body, one party, and more importantly, one Labour movement."
 CAN_hold_the_stand:0 "Hold The Stand"
 CAN_hold_the_stand_desc:0 "We must hold the stand against oppressors near and far. To do so, we must not bow down to foreign governments but keep our heads high and go on. It will be our finest hour."
 CAN_social_creditism:0 "Social Creditism"
 CAN_social_creditism_desc:0 "A new Party focused upon delivering Social Credit has risen from the ashes and has won the election once more."
 CAN_a_new_currency:0 "A New Currency"
 CAN_a_new_currency:0 "If we are to deliver Social Credit and meet end's meet, we must first establish it so as a second-hand currency."
 CAN_can_the_guns:0 "Ban Guns"
 CAN_can_the_guns_desc:0 "If we are to ban guns, we make our nation more peaceful like the Snow falling in the Winter and Socialist, like the red Maple leaf."
 CAN_a_new_leadership:0 "A New Leadership"
 CAN_a_new_leadership:0 "The Social Credit Party must be re-elected, and henceforth, comes a new leader."
 CAN_new_hope:0 "A New Hope"
 CAN_new_hope:0 "A new hope has been built from the ashes of the old, what no longer exists, and what burns anew."
 CAN_the_kings_party:0 "The King's Party"
 CAN_the_kings_party_desc:0 "Due to the electoral stalemate, the King of Canada has decided that his...party(?) has won the election. Surely this is unprecedented. Only time will tell."
 CAN_local_governance:0 "Local Governance"
 CAN_local_governance_desc:0 "It may be best to locally govern the lands of Canada under the King's decree so that he is not restless with too much power."
 CAN_support_fallen_dominions:0 "Support Fallen Dominions"
 CAN_support_fallen_dominions_desc:0 "If we are to recover our sunken Pride, then we must, with a heavy heart, accept our colonies are not far from being saved."
 CAN_offer_help:0 "Offer Help to Former British-Occupied Asia"
 CAN_offer_help_desc:0 "Offering help to former colonies may restore some integrity to His Majesty's Loyal Government."
 CAN_offer_help_2:0 "Offer Help To The Fallen Zealanders"
 CAN_offer_help_2:0 "We must help the New Zealanders who have fallen to others who may do bad with our former colony."
 CAN_rule_by_self_decree:0 "Rule By Self-Decree"
 CAN_rule_by_self_decree_desc:0 "If we are to get anywhere, we need to make sure people know our King means business, therefore all power must belong to him." 
 CAN_3_new_ideas:0 "Prosperity, Hope, Freedom"
 CAN_3_new_ideas_desc:0  "These are ideas all citizens of our country should aspire to follow and believe in."
 CAN_general_affairs:0 "General Affairs"