#Mittleafrika
 RKA_The_NSDAP_itself:0 "The NSDAP itself"
 RKA_The_NSDAP_itself_desc:0 "While we would rather not admit it, it's a sad fact that most of the National Socialists are way off their course. Simply take a look at Eastern Europe. Lebensraum has failed, everything has failed. While Maurice is sick in bed and struggling to hold our Reich together, decadent elements try to take their chances. Be it Speer's Architectures or Rosenberg's Mania. We are the last bastions of the true Aryan nation and we should intend to keep it so. Heil Hitler!"
 RKA_What_to_do_with_the_SS:0 "What to do with the SS?"
 RKA_What_to_do_with_the_SS_desc:0 "Another issue with the Hitler administration is the SS in Madagascar. Following the Madagascar plan, Jews in the millions have been sent year after year in name of "Lebensraum" but we know the truth. If we do not secure power or make a treaty, who knows what could happen!"
 RKA_The_Dreams_of_Mittleafrika:0 "The Dreams of Mittleafrika..."
 RKA_The_Dreams_of_Mittleafrika_desc:0 "Dream on Dream on Dream on DREAM ON DREAM ON SING WITH ME SING FOR THE YEAR"
 RKA_Is_a_nightmare:0 "Is a nightmare"
 RKA_Is_a_nightmare_desc:0 "No matter how much Maurice or Hitler try to think, Mittleafrika is no dreamy dreamland. It is an abhorrent colony which we admitedly try to fix but to no avail. Rampant rebels, factionalism, dead end communications, you name it! The only good thing for us is that we are the resource-basket of the Reich!"
 RKA_Marking_our_Enemies:0 "Marking our Enemies"
 RKA_Marking_our_Enemies_desc:0 "There are traitors and enemies all around us. Kamerun was never reclaimed and it led to Judeo Bolshevik scum taking power and mumbling about 'pan african liberation'. A French exil Government by Phillipe Petain has begun cross border conflicts, the last light of democracy and South Africa and finally, our own Party. Everyone is against us, and we must persevere!"
 RKA_The_Petainist_Remnants:0 "The Petainist Remnants"
 RKA_The_Petainist_Remnants_desc:0 "It would seem the Fall of Paris wasn't enough, the decadent French also follows us to Africa! T-T. Cross-border conflicts across the Sahara has been going on for a while, but we can use the.. Unique situation of French exiles to our advantage..."
 RKA_Erase_Francophile_elements:0 "Erase Franchophile elements"
 RKA_Erase_Francophile_elements_desc:0 "There shall be NO Baguette eating fools in our colony! Send them to Madagascar or-or  West Africa, anywhere! There must be no signs of Latin life in Mittleafrika."
 RKA_Ridicule_The_French_Situation:0 "Ridicule the French situation"
 RKA_Ridicule_The_French_Situation_desc:0 "Petain bro, you have like 3 other french exile States,  give up already. It's not that deep my guy"
 RKA_The_Pan_African_Scum_desc:0 "On the West lies the Cameroonian Pan African State, in short another Judeo-Bolshevik threat. They threaten to destroy the entire colony and unite Africa under their leftist degeneracy. If we don't keep them in check, we're cooked!"
 RKA_The_Pan_African_Scum:0 "The Pan-African scum"
 RKA_Court_Sokoto:0 "Courting Sokoto"
 RKA_Court_Sokoto_desc:0 "The no2 enemy of the Pan Africans are one of the biggest larpers in Africa : The Sokoto Caliphate. Sending them covert support and arms is one of the most efficient ways of vanquishing the threat of Communist Africa"
 RKA_Send_them_Men:0 "Send them men"
 RKA_Send_them_Men_desc:0 "The Sokoto Caliphate is prepared for war against Free France or even Kamerun. But we should make sure they have ample men to survive a sudden war of attrition."
 RKA_Another_Barbarossa:0 "Prepare for another Barbarossa"
 RKA_Another_Barbarossa_desc:0 "Though Barbarossa was a staggering success on Europe, this time it is going to be harder. There ARE parallels yes, but we are mostly alone in our fight against Kamerun. Therefore, we need to prepare our Reichskommissariat for any land war in Africa"
 RKA_Dealing_with_the_Rebels:0 "Dealing with the rebels"
 RKA_Dealing_with_the_Rebels_desc:0 "With our plans secured, it's time to look inwards. Across the territory, several rebel groups have begun to sprung up and it's high time we dealt with them, lest a collapse happens"
 RKA_The_South_Africans:0 "The South Africans"
 RKA_The_South_Africans_desc:0 "Another big threat is the South Africans. While they have their own problems and Apartheid system, they still pose a threat to our Southernmost territories. A plan must be made up soon."
 RKA_Our_own_Volkstaat:0 "Our own Volkstaat"
 RKA_Our_own_Volkstaat_desc:0 "Looking deeper into South African politics, it has been found out that they have pro-Nazi sympathetic organizations. The Ox-Wagon Sentinel. We should lease them a piece of land under our control and build up a rival State to put a spanner in the works!"
 RKA_Fall:0 "Fall"
 RKA_Fall_desc:0 "Ich hab mich ergeben mit Herz und mit Hand, 𝄆 Dir Land voll Lieb' und Leben, mein deutsches Vaterland!"
 RKA_Use_Standard_Colonial_Troops:0 "Use Standard Colonial Troops"
 RKA_Use_Standard_Colonial_Troops_desc:0 "Using normal beauracratic measures, we have decided to use normal colonial troops. Such as, Askari battalions, Shock troops and soldiers from home rather than giving an inch of influence to the SS."
 RKA_Work_with_Hutting:0 "Work with Huttig"
 RKA_Work_with_Hutting_desc:0 "Our best chance to survive the Years ahead is to work with the already established SS divisions in Dar-es Salam and Madagascar, lest we face any Heer-SS rivalries. We will approach the governer here, Hans Huttig and seek a mutual partnership regarding the SS presense in Africa..."
 RKA_The_One_Exception:0 "The ONE Exception"
 RKA_The_One_Exception_desc:0 "Among the many, MANY colleagues in the NSDAP, only Emil Maurice, the Fuhrer remains atleast according to Herr Hitler, the pinnacle of German National Socialism. Hitler and him were friends ever since the inception of the Party, Maurice even one time served as his chaffeur. So, he has decided to invite Maurice to a bit of tea time. Because... What hurt would it be in a moment between friends?"
 RKA_Hotline_Berlin:0 "Hotline Berlin"
 RKA_Hotline_Berlin_desc:0 "Hello Maurice, it's Hitler. We need 5 billion Germans to bomb Cameroonian children. Deutshland Uber Alles!"
 RKA_Send_A_Complaint:0 "Send a Complaint"
 RKA_Send_A_Complaint_desc:0 "We've had it! Nothing is working out and everything is going haywire. The resource extraction is being hampered by local rebels, The NSDAP refuse to follow Hitler and Madagascar is basically it's own State! We need Berlin's help and if they won't help, Hitler will take matters in his own hands."
 
 
 #NRRF
 
