 kai.1.t:0 "Question of the Kaiser"
 kai.1.d:0 "Kaiser Wilhelm II, despite his legendary legacy, isn't really pleasant when it comes to politics. Not only is he a bit power hungry, but he's also pricey, Germans have to pay their taxes to Wilhelm, and now, there's debates if the Kaiser should step down, or he should be strpped away from political influence, and focus more on being Germany's figurehead."
 kai.1.a:0 "Killing him would be lunatic, make him a figurehead."
 kai.1.b:0 "Was Bismarck a kaiser? No! Exile him!"
 kai.2.t:0 "Introduction of Bismarck Youth"
 kai.2.d:0 "Otto von Bismarck, the glorious leader who brought us to this great country, is popular around the youth, children play as general like Bismarck in the fields, and teenagers or young adults, often write about his legacy. Creating an organization for the young fellas, will only be able to strengthen us. However, in the Reichstag, some are debating what the age limit should go to. Some debate that it should be 13 to 19, whilst some debate it should be all the way down to 11, to 20."
 kai.2.a:0 "It should be 13 to 19."
 kai.2.b:0 "The more the merrier! 11 to 20."
 kai.3.t:0 "Rising Corruption"
 kai.3.d:0 "A few of the "loyal" politicians have been caught making economic deals with our opponents! The people of Germany are certainly not happy, as they have taken it to the street to protest! We must do something about this."
 kai.3.a:0 "You son of a gun, you thought i was gonna say bitch?"
 kai.4.t:0 "Gottfried Meets Tiger"
 kai.4.d:0 "Gottfried was taking a walk home, when he spotted a orange little kitten, meowing, he couldn't help but kneel down to the little feline. The kitten was fierce though, the little thing hissed and even tried scratching him. If a person had tried insulting Gottfried or attack him, it would be the death penalthy, no questions asked, which no one dared anyways, which was why Gottfried admired the little kitten. He went into the local store that wasn't far away, and bought some fish for the little cat. The kitten was very happy and licked Gottfried's hand. Gottfried realized the little thing was homeless, he picked the kitten up and stated "You're a fierce orange thing, alright. Your name is... Tiger." Tiger would always be at the Reichstag at his desk, sleeping, or licking Gottfried's hand, but if the other politicians tried petting Tiger, it would be met with a hiss and a disapproving glare from Gottfried."
 kai.4.a:0 "Adorable"
 kai.5.t:0 "Bismarckist Revolution!"
 kai.5.d:0 "placeholder"
 kai.5.a:0 "The first nation of Bismarckism is born."

 
