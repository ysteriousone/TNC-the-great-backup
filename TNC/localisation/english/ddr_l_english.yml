l_english:


 DDR_civilwar_1:0 "Roter Morgen"
 DDR_civilwar_1_desc:0 "The Second Spartacist Uprising has begun! The proletariat and youth of the Rhine have taken up arms in the chaos ready to bring forward a new Germany. With support from France and the occupation of large industrial lands, the revolution is able to mass produce weapons for their ultimate victory. Come to us, workers! The Red Morning is upon us!"
 DDR_civilwar_2:0 "The German Revolution"
 DDR_civilwar_2_desc:0 "The fighting is at full scale. Our revolution stands ready to march much like the Red Army did in 1917. We will not repeat the mistakes of the Spartacist uprising, we are ready this time. We shall be victorious!"
 DDR_civilwar_3:0 "Die Arbeiter"
 DDR_civilwar_3_desc:0 "Die Arbeiter. The workers. The proletariat. This is our core base. Those who have suffered under the weight of capitalism and explotation. With many being radicalized towards the far-left, we're able to increase our numbers greatly, ensuring our war effort shall be successful."
 DDR_civilwar_4:0 "Die Jugend"
 DDR_civilwar_4_desc:0 "Die Jugend. The youth. The young hold increasingly radical ideas that deviate heavily from the ideology of Maurice and the NSDAP. While being open about these ideas would get them killed, the anarchy and the civil war has allowed them to be more open and free about their thoughts. This has been great for our numbers and our support as a large number of young people looking for a free Germany join our ranks."
 DDR_civilwar_5:0 "Der Teufel"
 DDR_civilwar_5_desc:0 "When the country collapsed, the NSDAP itself split into multiple different factions. To the surprise of many, Joseph Goebbels, the  Reich Minister of Propaganda, has split off and formed a far-left wing of the NSDAP, harboring to the ideas of Strasserism. While usually we wouldn't associate with the NSDAP in any way, these people seem willing to work with us. They could be useful."
 DDR_civilwar_6:0 "Seize the Means of Production"
 DDR_civilwar_6_desc:0 "In order for socialism to thrive, we need a democratically run economy. As the business men and bosses flee our lands, the workers are able to take control of the means of production themselves. With the assistance of the state, these newly liberated workplaces have become democratically run, allowing for both better equipment and increased productivity."
 DDR_civilwar_7:0 "Promises of a Free Germany"
 DDR_civilwar_7_desc:0 "Germany has suffered under the boot of far-right totalitarianism for too long. If we are to appeal to the young of this country we must promise an alternative. We offer a free Germany, one with democracy and free from capitalist explotation. With us, the young shall flock to our side!"
 DDR_civilwar_8:0 "Invite Goebbels"
 DDR_civilwar_8_desc:0 "Goebbels, the leader of the Strasserist wing of the NSDAP has proven himself as a skilled politican and propagandist. While getting him on our side may be controversial, his skills are greatly needed."
 DDR_civilwar_9:0 "Risen from Ruin"
 DDR_civilwar_9_desc:0 "We've done it. Germany is free. From the ruins of the spartacist uprising we have risen to the status of leaders of a new Germany. However, our internal politics are divided. We must hold a congress to decide which faction shall ultimately take the reigns of this country."
 ddr.1.t:0 "Roter Morgen"
 ddr.1.d:0 "In the streets of Luxembourg, a large crowd gathers around a van, waiting patiently. Soon, they see Bertolt Brecht, famous theatre practitioner and playwright turned leader of the revolution. The crowd goes silent and Brecht gives a speech to rile up the masses. The mood amongst the crowd is ecstatic, this is finally the moment, liberation is coming! However, Brecht finished his speech with a warning. This is our one and only chance, and if we are to mess this up we may never see the light of freedom again. The crowd nodded. They were still excited, but they know they shouldn't get ahead of themselves. As Brecht leaves there's an astounding applause. One thought rushes through the minds of the German people."
 ddr.1.a:0 "'Oh god, this is really it.'"