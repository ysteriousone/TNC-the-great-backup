 #NEWS EVENTS
 world.1.t: "The Constituional Protection Convention forms"
 world.1.desc: "Following re-armament and reconstruction programs, The Republic of China has announced the new alliance formed by it and various like-minded Chinese warlords. A "Constituional Protection" convention has formed earlier today in Nanking, promising to restore the values laid out by old Koumintang leader, the late Sun-Yat-Sen. Of course, this has sparked several conspicious eyes across all of fractured China. Reportedly, the Qing are also preparing for their own  'Army of National Liberation'. Whatever new development will happen remains to be seen."
 world.1.a: "All loud on the Eastern front..."
 

 world.3.t: "Poles conquer Russia??"
 world.3.desc: "Interesting developments have occured in the barren wastes of what was once called Russia. As it would seem, the country has yet again become 'unified' in a sense by a power none other than The Republic of New Poland!\n\nFollowing the complete demolition of Poland in 1939, several refugees and Home Army forces found their way to Kazakhstan, specifically the regions in Uralsk and nearby. Following a hectic reunification war with other warlords around the Russian vacuum. They have established a new "Union" with all the other minorities in Russia in a sort of Federation.\n\nAnd the Poles are not done yet. They have one goal and one goal only in mind and that is their total reclamation of Warsaw and destruction of all Nazi forces."
 world.3.a: "Poland is not yet...lost?"
 
 world.4.t: "German Civil War"
 world.4.desc: "News has finally reached the World that the German Reich has fallen into Civil War.\n\nAs Berlin itself remains in Anarchy, fighting has already broken out elsewhere across the Divided Reich. From KPD loyalists, to Democratic elements, to Monarchists to even Nazi leadership, it would seem that Germany has made an early exit out of the Cold War due to the mishandling of the post leadership crisis following the death of Emil Maurice. Already, the German Colonies and allies are seeing massive anti-axis revolts and uprisings, signalling the end of Nazi hold over Europe..."
 world.4.a: "And down we go."
 
 world.5.t: "Kaiserboos victorious"
 world.5.desc: "Surprising news has appeared, with the German Empire under Hans Oster declaring victory in the Civil War.\n\nThis is shocked most of the World except for the Kaiser's earnest supporters as this signals the official end of the New Order created by the NSDAP and a sort of 'reversal' back to the old Kaiserreich. Bearing this in mind, the new Germany finds itself in an interesting new World fundementally incompatible with the restored Empire. Nontheless, The Empire is quickly rebuilding and replacing all pre Imperial policies, looking forward to the World Stage once more."
 world.5.a: "Wait..What?"
 
 world.6.t: "Tsarists unify Russia"
 world.6.desc: "Today, Romanov pretender Vladimir III has announced the restoration of the Russian Empire.\n\nComing from a Depressive and nihlistic phase, the Tsarists based in Vyatka have re-unified all of Russia in their banner. Not only that, it would seem that at the helm are the Liberal Constituional Democratic Party - The Kadets. Under their leadership, the Empire has taken a completely new face which includes free speech since a long time and a type of British model in leadership. Journalists and Russians dub this Empire "Imperial Benevolence". The Tsar is seen in an ecstatic mood and happy for his people.\n\nThe Empire now looks Westwards, to Saint Petersburg and Moscow"
 world.6.a: "The Empire long divided, must unite."
 
 world.8.t: "5th Balkan War"
 world.8.desc: "It seems that history never changes as yet another Balkan War has started almost instanteniously after the German Civil War. \n\nA Coalition formed by the Byzantine Republic and 'Carol-Land' has jointly invaded the Tsardom of Bulgaria. The Yugoslav remnants under Chetnik leader Draza Mikhailovic has also taken the change to invade both Bulgaria and the newly declared Uzice Republic in Banat. This has lead to a confusing treaty where Jozip Broz Tito had agreed on a temporary alliance with Bulgaria. It would seem it will be a strange new proxy war for the remaining Great Powers in the Cold War"
 world.8.a: "Something that feels nostalgic at last."
 
 world.9.t: "Solomonic - Pirate War"
 
 world.10.t: "Riots in Stockholm!"
 world.10.t: ""
 
 
 

# KOMI COUNTRY EVENTS
 NRRF.1.t: "Voroshilov's Exit"
 NRRF.1.desc: "Staying in the little town of Syktyvkar for any extended period of time is not good advice for any person seeking a healthy and fulfilling life. From the worker to the peasant, the recruit to his officers, their clothes are old, worn, stained with mud, blood, tears and smoke, their bodies thin from rations minimised to ensure survival at best, and the weather is plainly hostile. Sitting in his office in one of the few buildings with its heating system not already bombed out by the Krauts, Kliment Voroshilov stares at the reports scattered on his table. Food reserves emptied, soldiers having to equip themselves with salvaged weapons, bombs falling on railroads between here and…\n\nHis mind wanders back to the reason why he found himself in an old uniform amidst the Far North’s hostility. Ever on horseback, Voroshilov wandered between the scattered settlements, where people endlessly inquired about their cluelessness to the nearest authority figure, who happened to be as clueless as they were. In the end, as a Marshal of the Soviet Union, Kliment Voroshilov declared the North Russian Revolutionary Front to be the provisional government of all Russia, with him as its Provisional Chairman, in a half bombed-out hall in the biggest town he could find – the miserable grounds of Syktyvkar.\n\nVoroshilov then realised the painful fact that politicking is harder than commanding an army. His reading glasses get thicker by the year, his mind turns slow and clouded, his hands barely able to properly control a horse, his lungs tiring after a walk, and he lacks the capacity to hold up the endless shouting matches between Rokossovsky, Zhukov and Beria. Any citizen may have an inconsequential laugh over the rare bottle of vodka, but he is the commander. He is supposed to be the one bringing the Front its victory by skill and wit. And now that both are slipping away from him ever faster, how can he expect to reason to himself that he can, in fact, continue?\n\nSome time passed before a member of staff opened the door to his office. Kliment Voroshilov has just finished his resignation letter."
 NRRF.1.a: "Now that the throne is empty…"
 
 NRRF.2.t: "A cup of Tea"
 NRRF.2.desc: "Rokossovsky made his way to the local barracks, as he had a job as well as a personal work to do. Saluting the soldiers and having a brief conversation with them, he moved upstairs to the commander's office. He had an 'old friend' he wanted to meet. One might say... A Protege.\n\nPavel Batov was looking at the weekly newspapers the men had managed to steal during their usual skimishes against the Germans when he looked up to see Konstantin Rokossovsky in front of him. "Ah, Sir. I was expecting you, come take a seat!", he ushered to the seat which he pulled out. "How are you doing? Vodka?". "No, no. You can have it, I am here to talk with you", Rokossovsky replied.\n\n"Oh? What is it?"\n\nRokossovsky then gave Batov a file and documents, detailing recruitment reports and... Incriminating evidence against Lavrenty Beriya. Truth be told, Batov never liked that man, but one may wonder, how could a Marshal secure such files? "Forgive me for asking but... How did you get this?"\n\n"I got it from our old rival, Zhukov who was very keen to agree on co-operating with us for once, against this NKVD chief." Rokossovsky waited a bit and when he realised Batov was still busy reading the actual documents, he turned to leave. "Well I shall leave you to it, Comrade. I hope you find useful information from this. I will come back with more recruitment reports. I hope your Divisions are 'well-fed' compared to the others.\n\n Take Care.""
 NRRF.2.a: "And so they went their own ways.."
 
 NRRF.3.t: "Between Old Friends"
 NRRF.3.desc: "“Marshal of the Soviet Union Georgi Zhukov received an urgent telegraph immediately as he woke up. ‘FM K. K. Rokossovsky requires the urgent appearance of FM G. K. Zhukov’, says the barely-recognisable text supplanted above the uncomfortably sandy strip of paper. Zhukov grappled with his feelings for a moment, before letting the secretary go for the day. He penned a letter to his family, put it into an envelope, threw it into a desk drawer, prepared his uniform, and called his chauffeur.\n\nMarshal of the Soviet Union Konstantin Rokossovsky’s telephone rang. He whispered into the earpiece, let his secretary go for the day, and desperately tried to find another chair for the next five minutes before three curt knocks echoed from his door. He opened the door to the measured surprise of the honour guard escorting his guest, then asked the young man to find him a chair. The soldier saluted before promptly marching away.\n\nZhukov was clearly agitated. For some time, he acknowledged to himself his increasingly precarious position in the power struggle. More and more of his men have been sent back to HQ from Syktyvkar, replaced by Rokossovsky’s – and when Beria’s departure from the NKVD proved to be uncharacteristically unremarkable, Zhukov knew his ‘comrade’ Rokossovsky had won. He was prepared for everything – a ‘cozy retirement’, a ‘people’s trial’, anything. Anything but an offered shot of rare liquor from the person on the other side.\n\nRokossovsky was still standing. He analysed the smallest changes on Zhukov’s face. He knew his guest was afraid, he guessed what his guest thought his fate would be – yet he admired his guest keeping himself together. Rokossovsky silently smirked as he poured out the vodka – to a comrade, he cannot kill. Zhukov was as much a traitor as he was, quarrelling with each other for an estate bequeathed by their retired flag-bearer. He knew his guest loves his country as much as he does. He patiently gestured at the drinks, and waited. He saw surprise in his friend’s face, he felt relief in his own chest. ‘For Russia!’, they toasted."
 NRRF.3.a: "The soldier returned to see two Field Marshals, drunkenly recalling the past."
 
 NRRF.4.t: "The Natural Outcome"
 NRRF.4.desc: "Chairman of the Council of People’s Commissars Lavrentiy Beria still could not hide his smile, broader than many of the Glaswegian variety his fellow comrades of the People’s Commissariat for Internal Affairs inflicted on many of those who had probably voted for the delegates who ‘freely’ voted for him. It doesn’t matter that much to himself, Beria admits, not much more than his ‘employees’ used to ‘ensure the stability of the State’.\n\nIn his office, an old map of the Soviet Union, its territories from Ukraine to the Far East, from the Arctic Circle to Central Asia, demarcated in a bright, brilliant red that has lost its lustre, solemnly watches over the worn-out furniture. Nobody can understand how the Union lost the war against the Fascists so quickly, to the point where the only legitimate resemblance of what Lenin had started was a military government stepping halfway into the Arctic Circle. That shall no longer be the case.\n\nBeria has a plan. He shall accuse the commanders of dereliction of duty, of selling their countries to the Germans; he shall cite battles, real or imaginary; he shall make them pay for their factionism. He shall call in the executioners to take those despicable fiefs from the lands of the Revolution, so that it may prosper under the guidance of himself, the inheritor of Lenin and Stalin. Russia shall be a nation of steel, and its steel will beat back everything – even retreats, any retreats. Commanding expertise is secondary.\n\nOutside of the Commissariat compound, gunshots continue to ring. Blood continues to flow into the dirt, the snow, the water. The Union’s People continue on with their lives, with fear eclipsing hope in their weary eyes. The natural outcome per Beria is one of order and one of steel, but it lacks accountability, it lacks chivalry, it lacks humanity. And those who have seen Beria’s wanton purges first-hand in Moscow, in Leningrad, in Stalingrad ask themselves, in dooming monotony"
 NRRF.4.a: "Does he eveb have a soul?"
 
 NRRF.5.t: "So far from home"
 NRRF.5.desc: "In the freezing cold of Russia’s Far North, a platoon fights their way through the snow. From afar, they look not much different than the bandits roaming the mortally sickened corpse of Mother Russia, forcing the constant expulsion of sustainment and defiling her people – twenty-five men, shivering and hungry, in well-worn clothing of all kinds at best, slugging forward. But any closer inspection will reveal their true allegiance – on the left breast of their overcoats, tainted by sweat and mud and blood, sits a shining red star made out of metal. They are those who remain of the Red Army, those who chose to leave everything behind, those who refused the persuasions of the traitors. They dream of beating back the Germans, and that is why they march in the middle of the night. The borders of ‘the Last Bastion of Communism’ must be safe.\n\nOver in one of the rare concrete buildings the old Soviet Union gifted its destined successor, employees belonging to the Information Bureau of the North Russian Revolutionary Front of the Union of Soviet Socialist Republics continue working into the night. Their job on paper is to ‘disseminate facts’, their job in practice is to do the opposite – a poster showing a German tank blown up by a single soldier with a Mosin-Nagant 91/30 was cleared for printing yesterday. It would be false for one to assume that the Sovinformburo is monolithic: in its meetings, the rare artistic souls of the depressing Far North often hide their uncertainties under the masked, flowery language that they would later purge of any sentimentalism before putting in print. Nobody is sure that the NRRF is the sole guarantor of Communism in the former Union; nobody knows whether their new leader, if the beloved Marshal Klim were to resign, would become another Stalin; the list goes on. But they all share an artist’s romanticism towards Mother Russia. They would like to print posters and books celebrating her final triumph, under the red flag, one day.\n\nAnd in another quarter of Syktyvkar, Marshal Kliment Voroshilov walks out of his stable. Ever the cavalryman since his youth, Klim entertains himself after long, arduous, boring, sometimes furious meetings with his Generals and Ministers by riding on horseback through the ‘secured areas’ with some food prepared as gifts to any desolated village that comes his way. He chuckles whenever an innocent kid points at him, yelling ‘TSAR!!!’; he comforts the women whose husbands were lost to the bandits or nature; and he listens to the grievances of the people. He always wishes that he could do more. The fact that he couldn’t due to age and the situation locked the Marshal in place."
 NRRF.5.a: "We shall return..."
 
