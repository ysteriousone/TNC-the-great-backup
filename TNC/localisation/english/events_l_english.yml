 # FRENCH COUNTRY EVENTS
 
 fra.1.t: "Irony"
 fra.1.d: "‘Soldier-Comrade Theodore came from a family of workers’.\n‘Soldier-Comrade Leon’s relatives have all perished during the last war.’\n‘Soldier-Comrade Lehmeyer does not have any troublesome immediate family’.n\nSoldier-Comrade Jean-Paul quickly shuffled through the documents he laid on a piece of wood. Several days before, Jean-Paul the steelworker had come all the way from Toulon to Paris to hear Geroge Valois’ speech. How well did he lay bare to the average Parisian the irony of Picasso’s regime! For all the talk of benefitting workers, Paris still looks nothing different from when it was run by a bunch of crypto-royalists and class traitors! While the Government spends the majority of its time beautifying the Louvre, the workers still suffer! He was one of those who marched to the Hotel de Ville, one of those shot by Picasso’s army, and one of those who chose to stand their ground. He is now a political officer, in charge of keeping the Milice clean of class traitors and fellow travellers. He is to liberate all Frenchme–n\nA bullet slammed through Jean-Paul’s temple on one side and came out the other. He slammed onto the ground, his brains and blood already watering the soil below him. His subordinates immediately clasped their Fusil Gras while haphazardly rushing for cover – only to then get shot one by one. Men in khaki uniform soon appeared, peeking and rushing ever closer to Jean-Paul’s dead corpse. They confidently and professionally moved forward, their commands short and sharp, and their fire crisp and incredulously accurate. The troops then signalled safety to their officer, who promptly retrieved Jean-Paul’s case – not before scanning the documents and laughing to himself for the fact that even the Anarchists have a state security apparatus. He couldn’t help but smirk at the dead corpse next to him with his brains blown out and his eyes wide open – what an absolute idiot! His wonders on why fresh troops are often sent to fight the Milice Anarquistas were dashed as his men marched back to base. It’s too easy.n\nNot afar stood an Englishman, hiding behind a massive tree, observing the combat. He looked at the charade in front of him – some dreamers with antique guns in trenches not even dug properly getting mowed down by fresh recruits dressing in hastily-recoloured Great War apparel, with an officer overconfident in his abilities. Oh, how the great had fallen! As France lost its balance, he hoped that the French folk would still have some sense left in them – they needed a leader, not a gang of posers – and they still hadn’t woken up. He soon scribbled details of the ambush on his scrapbook, ending with…"
 fra.1.a: " …the French killing the French is the greatest irony of all."
 
 
 
 # GERMANY COUNTRY EVENTS
 
 
 ger_reich.1.t: "Here Comes the Sun"
 ger_reich.1.d: "A man slogs heavily along a tattered dirt track. His skin was wrinkled, patched, and dry; his hair a mix of brown and white; his physique impossibly thin. His looks are that of a man tired of life, a man whose only purpose in existence is now seeking nourishment until his own demise. From the outside, he looked the part – even too old to be walking out alone in the forests like this. But ask any reckless local and they would tell you, in their mother tongue, under their breath, that he is only around fifty-five. A former Legionnaire who defended the Vistula in his youth, an officer in Pilsudski’s Army, one of the many defenders of Poland against the Fascist horde of years bygone. He lives in the wild, in a constant cat-and-mouse game against the Nazis trying to catch him, torture him, make an example out of him – and he’s always won. They admire him, they honour the man who keeps fighting for his sake and theirs. He might be Poland’s last folk hero.n\nThe man pulls out an old, fading, burned scrap of paper. There was his wife, there were his kids, there was him. The Legionnaires’ czapka mightily sat atop a well-groomed head, its eyes looking sternly forward into something in the distance. That was his past until the Nazis came – and as his unit failed to block the Kraut scum, his abode burned and his family disappeared. Of course he only knew this a long time after the fact, but it made things no less painful. He was desperate, sure; he thought about taking his life, sure. But his faith in God and his love for Pilsudski’s Poland did not allow him to – it sustains the fire in his heart, limping and wheezing but still burning despite the odds. Still, he couldn’t do anything better but run. He badly wants to garner true Polish men to fight for a true Polish cause – but how many would turn up for all the terror and exhaustion of Fascist rule? His heart pains as his thoughts soon turn to ‘how many remain?’.n\n Not a split second after, he throws himself to the ground, into a ditch. His body was used to reacting to loud explosions, and this is no exception. He closes his eyes, relaxes his jaw, and covers his ears. But this time, the flash seems to last far longer, the sound blasted far louder, and the sheer pressure locks his teeth in place. The heat tingles on his skin, the light seems to pierce through the skin on his eyelids, the wind unnaturally blows… until it suddenly stops. The old Legionnaire quickly raises up, dusts his clothing, and runs away. But not long after he starts running, he looks down from the hill he is on. He knows Poland’s true capital, the great city of Warsaw, lies in that direction. But, instead, he saw a mushroom cloud rising towards the sky."
 ger_reich.1.a: "Poland’s soul joins its nation,\n seeking justice in death."
 
 
 ger.1.t: "Doctor’s Visit"
 ger.1.d: "To be fair, Führer und Reichskanzler Emil Maurice has been feeling under the weather lately. Having pushed old Hitler to the depressing lands of Africa and Himmler to his little plaything, Maurice thinks he deserved a little vacation in what was once Crimea – before the stock exchange collapsed and everyone started asking their Fuhrer for guidance. He dumped all responsibilities onto the hands of Albert Speer, still busy drawing up plans for the new Welthauptstadt, and decided to go to the hospital to get a doctor’s note for… anything, really.n\n Doctor Ernst Frahm was drinking Kaffe-Mix, something that he liked to describe as ‘powdered shit with coffee flavour’, when the phone on his table started to violently ring. He picked it up, then put it down. He moved to the cupboard at the far end of the room, his composure calm and measured, and took out a clipboard of forms and a box of pens. The other person in the room, a nurse, wished him good luck. Frahm returned a nod.n\n The Fuhrer’s security entourage quickly rushed into the hospital, forming a sterile, supervised corridor of clean hallways and shut doors – quite different from the lack of detergent and floor cleaners lately. As the motorcade arrived and the small man sped his way into Dr. Frahm’s room, the guards in front of his door heard the usual small talk between a doctor and his client. Then everything quickly fell silent.n\n Before they could have realised anything, the two guards outside Dr. Frahm’s room suddenly fell down, as the Doctor emerged with the Fuhrer’s corpse, marked with a clean shot to the forehead. He wasn’t wearing a blouse, nor was he holding a pen – the security entourage saw a man in a three-piece suit with two silenced Lugers. Though, it was his sunglasses that gave them everything – the Doctor was that outlaw Willy Brandt, and he just killed the Fuhrer. Before the bemused entourage, mostly recruited from nepotism, could wake up from their stupor, they were quickly taken down by Brandt’s ‘colleagues’, still sporting blouses, from every other room and every other hallway. n\n As planted patients cleaned up the hospital and burnt down the corpses in the incinerators for the mentally unfortunate, the ever-charismatic Brandt and his fellows drove around in the vehicles left by the Fuhrer’s entourage. On soon-to-be-renamed Berlin’s wide boulevards, the message is clear: It wasn’t the Fuhrer in his fortress… It was his mortal enemy on a joyride"
 ger.1.a: "Assemble the Reichstag!"
 ger.1.b: "And so it ends.."
 
 
 ger_reich_2.t: "The Miracle Ends"
 ger_reich_2.d: "Frank Ostloh, a manager in the myriad of managers running the Frankfurt Stock Exchange, glanced at the documents unceremoniously dumped at his table by his employees. He couldn’t blame them.’Sell’ orders proliferated the wooden surface, already finished by the multitude of faces showing varying degrees of surprise, panic and exhaustion. He had his own suspicions about the MEFO bills, the way the Reich organises its economy, and many other things; mostly stemming from his classical economic education. Now, as he grabs his forehead and wipes off the sweat from his rapidly whitening hair, he pushes the numbers into a mechanical calculator. The indices dropped by a hundred, five hundred, a thousand. Never seen before.n/n Otto Lehmeyer, one of the many Mittelstandler of the new-old economy, locked himself in his bathroom. He was finishing his orders yesterday with his 25 workers in the small porcelain plant, but all fell apart – as the mail arrived, no, spilled out of his mailbox, he started reading. ‘Order cancelled’, ‘Interest rate announcement’, the bad news goes on. He let out a suppressed sigh – yes, the papers were right, the Wertpapierborse did kill itself yesterday. That’s why people are tightening their belts and the monthly interest on his loan shot up astronomically to the point where selling off everything he had can’t last him a month. Lehmeyer pulls off his trouser belt, makes a prayer to God, then hangs himself.n/n Heinrich von Ehmler, a member of the Imperial aristocracy and now a high-ranking official in the NSDAP’s Frankfurt apparatus, lightly put down the day’s Frankfurter Zeitung. He contemplated sending the SS to remind them of ‘National Socialist values’ after they turned in their decision for the front page – ‘Frankfurt Stock Exchange Indices Drops by 19%’ – but interrupted himself from doing so after his informants turned in reports that set said figure at somewhere closer to 38%. More than a third of Germany’s most important stock exchange wiped in a day, and Berlin still hadn’t given him an answer. The aged von Ehmler thought into the night, before letting his aristocratic side win – he called everybody he knew and asked them to keep Frankfurt safe…"
 ger_reich_2.a: " …for he can sense the time of troubles coming."