 BUL_bulgarian_hegemony:0 "Bulgarian Hegemony"
 BUL_bulgarian_hegemony_desc:0 "In 1941, Bulgaria would prove to the world that despite having lost a world war, they could still fight bravely, and they did. Yugoslavia and Greece would be faced with our wrath. Despite how powerful the Bulgarian army is, there's still fear around us. Serbs, Romanians and Greeks are interested in some of the land we possess, and if war is what they need to do, it's most likely. That won't stop the Bulgarian people for being patriotic for their country."
 BUL_prussia_of_the_balkans:0 "Prussia of the Balkans"
 BUL_prussia_of_the_balkans_desc:0 "Bulgaria still manages to be the nation the balkans fear. With a army focused more so on strategy and less on having the bigger number, there is a reason Yugoslavia and the Greeks fumbled under us."
 BUL_cooperation_with_UBNL:0 "Cooperation with UBNL"
 BUL_stagnant_economy:0 "Stagnant Economy"